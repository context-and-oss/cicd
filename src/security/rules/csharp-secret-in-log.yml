# cicd's first-party C# rule for a credential written to a log (CWE-532).
# Wired as csharp-log-forging.yml is. The source is a name, not a type: a value
# called password or apiKey, minus names that are about the credential (its
# length, policy, header name). See specs/cover-csharp-log-injection.md.
rules:
  - id: cicd.csharp.secret-in-log
    languages: [csharp]
    severity: WARNING
    message: >-
      A value named as a credential reaches a log entry. Logs are kept longer
      and read more widely than the secret store it came from. Log that it is
      set, not what it is.
    metadata:
      category: security
      cwe: ["CWE-532: Insertion of Sensitive Information into Log File"]
      technology: [dotnet]
    options:
      interfile: true
      # What a function returns from a credential (a count, a lookup, a
      # result set) is not the credential.
      taint_assume_safe_functions: true
      taint_assume_safe_numbers: true
      taint_assume_safe_booleans: true
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: $X
          # A plain name or a member path whose last segment names a
          # credential. Anchored, so a string literal ("Password reset"), a
          # call or an indexer never matches.
          - metavariable-regex:
              metavariable: $X
              regex: ^(?:@?[A-Za-z_]\w*\.)*@?[A-Za-z_]?\w*(?i:password|passwd|passphrase|secret|apikey|api_key|accesstoken|access_token|refreshtoken|refresh_token|idtoken|bearertoken|connectionstring|privatekey|private_key|accountkey|sharedkey|sastoken|signingkey|encryptionkey)\w*$
          # A policy value, a flag or a name *about* the credential is not it.
          - metavariable-regex:
              metavariable: $X
              regex: ^(?:@?[A-Za-z_]\w*\.)*(?!(?:Has|Is|Can|Should|Requires|Use|Allow)[A-Z])(?!\w*(?i:length|policy|required|expir|hint|reset|changed|lifetime|name|names|id|ids|setting|section|(?:connectionstring|password|secret|token)key|header|field|key(?:vault)?uri|url|uri|path|type|count|enabled|options|settings|provider|validator|hasher|attempts)$)\w+$
    pattern-sinks:
      - patterns:
          - pattern: $LOGGER.$LOG(...)
          - metavariable-regex:
              metavariable: $LOG
              regex: ^(Log|LogTrace|LogDebug|LogInformation|LogWarning|LogError|LogCritical|BeginScope)$
      - pattern: Console.Write(...)
      - pattern: Console.WriteLine(...)
    pattern-sanitizers:
      - pattern: $X.Length
      - pattern: string.IsNullOrEmpty(...)
      - pattern: string.IsNullOrWhiteSpace(...)
      - pattern: $X == null
      - pattern: $X != null
      - pattern: $X is null
      - pattern: $X is not null
      - pattern: $H.ComputeHash(...)
      - pattern: $H.HashData(...)
