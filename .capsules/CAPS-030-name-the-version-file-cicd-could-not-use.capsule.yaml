kind: change-capsule
schema: 1
id: CAPS-030
status: sealed
intent: >
  ADR-004 resolves the container a consumer command runs in at three levels, and
  level two reads a version file. ResolveToolchain in
  src/internal/detect/toolchain.go returned a bare image string and its two
  readers returned a string and a bool, so false meant both that no such file
  exists and that a file was read and rejected. The caller could not separate
  them, and the reason it could not is that the image is identical in both
  cases. The pinned dotnet band is both what a global.json can ask for and what
  a repository gets for asking nothing, so the answer carried no trace of the
  question.

  Two of the collapsed states are things a careful consumer does on purpose. An
  nvm alias such as lts/iron is idiomatic and not a typo, and cicd cannot turn
  it into a tag because the mapping from alias to release lives in nvm. A
  runner-only global.json is worse, because this repository's own guidance tells
  the consumer to write it. The runner key is documented as the only mechanism
  that selects the Microsoft.Testing.Platform command line, and a file
  containing only that key has no sdk key, resolves at the pinned band, and that
  band predates the opt-in and routes the invocation through the other runner.

  So the resolver now reports the image, the level that chose it, and a note.
  src/quality/byotest.go collects the resolutions it already computed per leg
  and hands them to toolchainNoteWarnings in src/quality/testlegs.go, which
  emits one warning per anomalous leg, and legReport gains toolchainFrom and
  toolchainNote.

  The trigger is present-but-not-decisive rather than declared-but-unparseable,
  and that distinction is the whole design rather than a detail. The narrower
  reading was the first one settled on and it is silent on the case that
  motivated the report, because in a runner-only file sdk.version is absent
  rather than broken. The disjunction covers a missing key, an unusable value,
  malformed JSON, an nvm alias and an empty file under one rule with no list of
  cases to keep extending.

  Silence is kept where silence is informative. No version file means no line,
  which is deliberately the opposite call from the every-run dotnet leg scope
  warning. There every run is in the same epistemic position so an absence
  carries nothing. Here the absence is the answer.

  Separately, the three copies of the resolver were guarded by nothing at all. A
  grep of Makefile, scripts and the inventory for toolchain.go returned empty,
  which is the same hazard as a marker missing from two of its three lists for
  as long as nothing compared them. A synced_files entry would not have been
  enough, because it compares copies against each other and the drift that
  happens is both copies agreeing while the canonical file moves out from under
  them. Measured, appending one line to the canonical file left
  src/quality/toolchain.go and src/build/toolchain.go at the identical md5. So
  the copies are generated by scripts/sync-toolchain.py and check_generated_files
  in scripts/repo_surface.py re-runs the generator and diffs the result.
impact:
  visibility: external
  benefit: >
    A version file cicd read and could not use is now disclosed in the evidence
    of the run rather than only in a document about the run. quality.Test warns
    once per affected leg, naming the file, what it said, and the image used
    instead, and each leg records toolchainFrom and toolchainNote as structured
    fields so the same information is available to something comparing envelopes
    rather than reading one. A repository with no version file is unchanged and
    still silent. The image every existing caller resolves is unchanged, and a
    table row asserts that for every case. Separately the three copies of the
    resolver acquire the only guard that can see the drift that actually
    happens.
  compatibility: additive
  risk:
    - >
      A new warning fires on repositories that were previously quiet, including
      ones doing nothing wrong. An nvm alias is idiomatic and a consumer may not
      care which node minor runs their tests. It is a warning at every threshold
      and never an error for that reason, so no gate verdict moves, but a
      pull-request comment that was clean will now carry a line. Accepted,
      because the alternative is the silence being removed.
    - >
      build.BuildArchive resolves through the same code, receives the same note,
      and cannot report it. It returns a directory rather than an evidence
      envelope because the commit composite hands that lazy reference to the
      archive scan, so there is no warnings array on that path. Surfacing it
      means changing a consumer-visible return type or adding a second entry
      point, which is outside this change. Left silent and written down as
      silent in specs/name-the-version-file-cicd-could-not-use.md and in
      docs/how-to-guides/use-without-dockerfile.md, rather than half-fixed.
    - >
      check_generated_files runs a Python generator as a subprocess during the
      surface check, which is new behaviour for a check that previously only
      read files. A generator that cannot run is reported as a problem rather
      than a pass, so the failure mode is a red check and not a false green.
    - >
      The two documents CAPS-029 corrected asserted this silence exists, and
      that assertion is now false. Both are updated in the same change. This is
      the staleness risk CAPS-029 named about itself arriving on schedule, which
      is an argument for the caveat having been written with a link rather than
      an argument against having written it.
decisions:
  - id: d01
    choice: trigger the note on a version file that was present and did not determine the image
    options:
      - warn when sdk.version was declared and could not be parsed (rejected)
      - warn on every resolution so the line is never missing (rejected)
      - warn when a present version file did not determine the image (chosen)
    because: >
      The narrow key-level reading fires on an unusable value and on malformed
      JSON and stays silent on the runner-only file that motivated the report,
      because there the key is absent rather than broken. It would have shipped
      a fix that does not cover its own headline case. Warning on every
      resolution destroys the thing that makes the warning worth reading, since
      a disclosure on every run is noise a reader learns to skip, and it is the
      wrong trade here specifically because the absence of a version file is
      itself the answer rather than an unknown.
    confidence: high
  - id: d02
    choice: keep ResolveToolchain as a wrapper instead of changing its signature
    options:
      - change the signature and update every call site (rejected)
      - add a detail function and keep the old one as a wrapper (chosen)
    because: >
      Two production call sites and two test files use the existing function,
      and the change has to be image-preserving on all of them. A wrapper makes
      that assertable rather than assumed, and every row of the provenance table
      checks that the wrapper and the detail agree on the image, so a later edit
      cannot let them diverge quietly. src/build/archive.go keeps using the
      wrapper because it has nowhere to report the extra information.
    confidence: high
  - id: d03
    choice: generate the module copies rather than only comparing them
    options:
      - declare the copies as a synced_files group (rejected)
      - generate the copies and re-run the generator in the surface check (chosen)
    because: >
      Comparing copies against each other cannot see the drift that actually
      happens. Editing the canonical file and forgetting every copy leaves the
      copies byte-identical to each other and wrong, and the comparison passes
      in silence. Measured on this tree at both revisions. Regenerating from the
      canonical source is the only form of the question that fails in that case,
      and it also gives the copies a written definition of what they are allowed
      to differ by.
    confidence: high
  - id: d04
    choice: put the warning composer in the untagged file rather than inline in the tagged one
    options:
      - build the warnings inline in the resolution loop (rejected)
      - extract toolchainNoteWarnings into src/quality/testlegs.go (chosen)
    because: >
      The invariant worth asserting is a biconditional, that a warning appears
      if and only if a resolution carries a note, and a loop behind the
      no-unit-test build tag cannot be asked about it. That is the shape that
      let a switch with no default arm resolve an include value to an empty
      language set and report a pass, so the negative half of the biconditional
      is the half a test has to be able to reach.
    confidence: high
  - id: d05
    choice: bound the quoted file content without stripping backticks from it
    options:
      - replace markdown-hostile bytes in the quoted value (rejected)
      - bound and sanitise control characters only, and test that a backtick survives (chosen)
    because: >
      Markdown safety belongs to the renderer, which fences a code span with the
      longest internal backtick run plus one so the content cannot terminate it,
      and the card renderer emits no warnings at all. Replacing the byte here
      would re-introduce the stripping that the fencing spec rejected, edit a
      value the consumer reads back, and leave two copies of one rule free to
      disagree. A test asserts the backtick is carried verbatim so the boundary
      is recorded rather than rediscovered.
    confidence: medium
tags:
  - toolchain
  - dotnet
  - node
  - evidence
  - repo-surface
