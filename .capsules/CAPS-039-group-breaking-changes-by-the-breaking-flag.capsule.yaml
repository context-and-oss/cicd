kind: change-capsule
schema: 1
id: CAPS-039
status: sealed
intent: >
  v2.0.0, this repository's first major release since v1.0.0, published its one
  breaking change under the heading "### Bug Fixes". The version was correct —
  cliff read the BREAKING CHANGE footer and bumped major — and the per-commit
  **BREAKING** prefix rendered, so commit.breaking was true. Only the group was
  wrong, which is the half a reader sees first.

  The cause is that cliff.toml selected the breaking group with a commit_parsers
  rule, { body = ".*BREAKING CHANGE" }, and with conventional_commits = true a
  BREAKING CHANGE footer is lifted out of commit.body into commit.footers before
  any parser runs. Measured on git-cliff 2.13.1 via --context: for a real breaking commit the
  body does not contain the string at all, while footers carries a token of
  "BREAKING CHANGE" and breaking_description is populated. commit_parsers are
  first-match-wins, so the rule matched nothing and { message = "^fix" } claimed
  the commit.

  The rule was therefore not merely dead. It was inverted. Because a correctly
  written footer is never visible to it, the only commit it could ever match is
  one that mentions the words in prose without a valid footer — which is not a
  breaking change. Measured: a fix: commit whose body reads "We will land a
  BREAKING CHANGE next release, not now" was filed under "Breaking Changes"
  while the release bumped a minor. The rule could only ever fire when it was
  wrong, in the opposite direction to the defect that exposed it.
impact:
  visibility: external
  benefit: >
    Breaking changes are now selected by commit.breaking, which cliff sets from
    the footer and from a ! subject alike, so a breaking change is printed under
    "Breaking Changes" whichever way it was declared. The v2.0.0 range regroups
    correctly and the v1.18.0 and v1.19.0 ranges regenerate byte-identically.
    --bumped-version is unchanged for every commit shape measured, so nothing
    about which version a range releases moves.
  compatibility: compatible
  risk:
    - >
      Release notes already published are not regenerated by this change. The
      v2.0.0 release body was corrected by hand; any earlier release that
      carried a footer-declared breaking change still shows the old grouping,
      and nothing detects that.
    - >
      Selection now lives in the Tera template rather than in commit_parsers, so
      a reader looking for the grouping rules finds only the type parsers in
      commit_parsers and has to read the template to learn that breaking
      commits are pulled out ahead of them. The comment above the template says
      so, but the logic is split across two blocks of one file.
    - >
      The template filters each group with filter(attribute="breaking",
      value=false) and prints the heading only when something survives, so a
      group whose every commit is breaking is suppressed rather than rendered
      empty. This depends on filter and length behaving as measured on Tera as
      shipped in git-cliff 2.13.1; a future git-cliff could change the filter
      semantics and the failure would be a missing or empty heading, which no
      check would catch.
    - >
      The chore-plus-footer trap documented in scripts/release_bump.py is
      deliberately left in place: such a commit still releases nothing and is
      still reported as a defect by the release gate. Anyone reading this
      capsule as "breaking changes are now handled correctly" would be wrong
      about that one shape.
    - >
      scripts/check-release-bump.py parses cliff.toml textually for the skip
      rules, locating the line that begins commit_parsers and reading to the
      closing bracket. The comments added above that array are indented comment
      lines and do not affect it — verified by calling read_skip_patterns on the
      edited file — but the coupling means future prose near that array can
      break the release gate.
decisions:
  - id: d01
    choice: select breaking changes in the changelog template rather than in commit_parsers
    options:
      - add a { footer = "^BREAKING CHANGE" } parser ahead of the type rules (rejected)
      - combine message and footer in one parser so both must match (rejected)
      - move the footer parser below the skip rule to limit its reach (rejected)
      - filter on commit.breaking in the body template (chosen)
    because: >
      A footer parser does match, but commit_parsers are first-match-wins and it
      has to outrank ^feat and ^fix to have any effect — which also puts it ahead
      of the skip rule, so a chore: carrying a breaking footer would stop being
      skipped and start releasing a major. Measured: chore + footer goes from
      v1.0.0 to v2.0.0 under that ordering. That is a change to what gets
      released, and it would contradict the measured table in
      scripts/release_bump.py, whose purpose is to fail the release when cliff
      disagrees with it.

      Combining the two fields in one parser does not restrict it: measured on
      2.13.1 the fields OR rather than AND, so such a rule filed every plain
      feat: and fix: under Breaking Changes. Moving the footer rule below the
      skip rule is a no-op for the same first-match-wins reason — the type rules
      above it claim the commit first, and the config renders identically to the
      unfixed one on every case tried.

      The template touches nothing cliff uses to compute --bumped-version, so
      the released version is provably unchanged for every commit shape while
      the heading moves. That is the smallest change that fixes the defect
      without altering what the repository releases.
    confidence: high
  - id: d02
    choice: delete the { body = ".*BREAKING CHANGE" } parser rather than leave it in place
    options:
      - keep it as a harmless second line of defence (rejected)
      - remove it (chosen)
    because: >
      It is not harmless. A correctly written footer is never in commit.body, so
      the rule can only fire on a prose mention that is not a breaking change,
      and when it fires it files a non-breaking commit under "Breaking Changes"
      while the release bumps a minor — measured. Leaving it would keep a rule
      whose every possible activation is a false positive, and would also leave
      a reader believing the footer case is covered by a parser when it is not.
    confidence: high
  - id: d03
    choice: leave the chore-plus-footer trap to scripts/release_bump.py
    options:
      - fix it here by ordering a footer parser ahead of the skip rule (rejected)
      - leave the shape releasing nothing and reported as a defect (chosen)
    because: >
      Fixing it here would make a chore: commit able to trigger a major release,
      which is a surprising thing for a chore to do and a change to release
      semantics that nothing asked for. The shape is already caught: release_bump.py
      classifies it as a defect and stops the release with a message telling the
      author to put the ! in the subject. So the two outcomes on offer are an
      author holding a named remedy and no release, or a major shipping that
      nobody declared. Leaving it also keeps that module's measured table true.
    confidence: medium
  - id: d04
    choice: drop the **BREAKING** per-item prefix
    options:
      - keep the prefix inside the Breaking Changes section (rejected)
      - print the bare subject under the section heading (chosen)
    because: >
      Under the old template the prefix was the only signal that survived a
      wrong group, which is how the v2.0.0 note remained readable at all. With
      the section heading now correct the prefix repeats it on every line.
      Nothing in the repository greps for the marker — checked — so removing it
      costs no consumer.
    confidence: medium
tags:
  - release
  - changelog
  - git-cliff
  - breaking-change
