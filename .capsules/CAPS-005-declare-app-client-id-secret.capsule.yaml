kind: change-capsule
schema: 1
id: CAPS-005
status: sealed
intent: >
  Declare CICD_APP_CLIENT_ID on both reusable workflows and make the
  module-reader identity a checked precondition instead of an assumed one.
  commit.yml and precommit.yml both read
  secrets.CICD_APP_CLIENT_ID || secrets.CICD_APP_ID for the App client id,
  but neither declared the first name in on.workflow_call.secrets. A caller
  can only pass secrets the reusable declares, and only secrets inherit
  carries undeclared ones, so for every consumer that maps secrets
  explicitly the client id resolved empty inside the reusable, always. The
  documented, preferred org secret was a dead knob for exactly the
  least-privilege callers most likely to set it, and the legacy numeric app
  id kept authenticating on a green run. The second failure was worse and
  reachable: an org holding only a client id has nothing real to put in the
  then-required CICD_APP_ID, so both operands resolved empty, an empty
  client-id went to actions/create-github-app-token, and the run died in a
  token-minting error that named neither secret.
impact:
  visibility: consumer
  benefit: >
    An explicit-secrets caller can now pass CICD_APP_CLIENT_ID at all, and
    an org that never had a numeric app id can express its configuration.
    A missing identity fails the first step of the workflow, in seconds,
    naming the secret it wanted, instead of failing minutes later inside a
    third-party action that knows nothing about our secret names. And every
    run states which identity authenticated, so a consumer who set the org
    secret can tell whether it actually took effect.
  compatibility: fix
  risk:
    - >
      Both identity secrets are now optional, so GitHub's startup validation
      no longer rejects a caller that supplies neither. That rejection moved
      into a workflow step, which means it now costs a runner and arrives as
      a failed job rather than a refused call. That is the deliberate trade,
      because startup validation could only ever enforce the wrong
      proposition, but it is a real change in where the error appears.
    - >
      The preflight proves a value is non-empty, never that it is correct. A
      wrong client id, a key that does not belong to the app, or an app
      without access to context-and-oss/cicd still fails in the mint step. This
      is not a credential validity check and must not be read as one.
    - >
      The identity notice is printed by the reusable workflow only. A
      consumer whose own workflow mints the token itself, as the
      mix-and-match and individual-module how-tos show, copies the same
      fallback expression with no preflight behind it and keeps the
      unhelpful far-away failure.
    - >
      The preflight body is duplicated in three places by shape, one per
      reusable plus the secrets block prose, and cannot be factored into
      scripts/ because a reusable workflow executes against the consumer's
      checkout where no cicd script exists. commit.yml already carries an
      inline mirror of scripts/commit-diff.sh for that reason. The two
      copies were verified byte-identical when written; nothing enforces
      that they stay so.
    - >
      Nothing in this repository's CI executes either reusable workflow.
      dogfood-precommit.yml calls the local composite directly, so the
      workflow_call path, its secrets contract and this step are proven only
      by a local run of the extracted step body and by the first consumer
      that upgrades.
decisions:
  - id: d01
    choice: declare CICD_APP_CLIENT_ID as an optional secret on both reusables
    options:
      - leave it undeclared and drop the fallback expression (rejected)
      - declare it optional on both reusables (chosen)
    because: >
      Dropping the fallback would break every org still on the numeric id,
      and the fallback is what makes the migration incremental. The name is
      read, documented and recommended, so it has to be declarable.
    confidence: high
  - id: d02
    choice: CICD_APP_ID drops to required false, and neither identity is required
    options:
      - keep CICD_APP_ID required true (rejected)
      - make CICD_APP_CLIENT_ID required true instead (rejected)
      - both optional, with the real rule checked by the workflow (chosen)
    because: >
      GitHub can only require a named secret, never one of a pair, so any
      choice of required true encodes a proposition that is false for half
      the consumers. Required on the legacy id makes the modern documented
      configuration inexpressible for an explicit caller, which is the bug.
      Required on the client id would reject every legacy-only explicit
      caller at startup, turning a fix into a breaking change on upgrade.
      Relaxing requiredness cannot reject a caller that used to work, so
      both optional is the only additive option. Also measured against the
      docs, secrets inherit carries secrets the reusable does not declare,
      which is why inherit callers are unaffected either way.
    confidence: high
  - id: d03
    choice: a preflight step that fails loud and names the missing secret
    options:
      - let actions/create-github-app-token fail on an empty client-id (rejected)
      - skip the mint step when no identity is set (rejected)
      - preflight the pair as the first step of the job (chosen)
    because: >
      This repository's founding rule is that a step which could not do its
      work must never read like one that did, and an unresolvable credential
      path is that rule applied to configuration. The third-party action's
      error names no secret of ours, so the message cannot lead anyone to
      the fix. Skipping the mint step is the worst option available, since a
      skipped step is green and the failure would then surface as an
      unauthenticated module fetch even further away. Placing the check
      before the fetch-depth zero checkout means the answer costs seconds.
    confidence: high
  - id: d04
    choice: print which identity authenticated, every run
    options:
      - declare the secret and stay silent (rejected)
      - name the identity in use on every run (chosen)
    because: >
      Declaring the secret only makes it passable. An explicit caller that
      forgets to add it to its map is in exactly the old state, green and
      still on the legacy id, and no signal distinguishes that from a
      successful migration. The legacy path prints a notice so it reaches
      the run summary rather than only a step log.
    confidence: high
  - id: d05
    choice: one preflight per reusable, none duplicated into the pages job
    options:
      - add a fourth copy to commit.yml's pages job (rejected)
      - rely on pages needs commit (chosen)
    because: >
      The pages job mints the same token from the same two secrets, but it
      is needs commit, so it cannot start unless the preflight in that job
      already passed. A fourth copy of the same shell buys nothing and adds
      one more place to drift. The dependency is named in a comment beside
      it so a later refactor knows the guard is load-bearing.
    confidence: medium
tags:
  - workflow-call
  - secrets
  - credentials
  - reusable-workflows
