kind: change-capsule
schema: 1
id: CAPS-043
status: sealed
intent: >
  src/internal/evidence/schema.json declares additionalProperties false and was
  missing six fields that ship in every envelope — findings, sources, tests,
  testsByLanguage, coverageLines and coverageLinesByLanguage — plus the three
  $defs those fields need. Any consumer that validated an envelope against the
  published schema would reject the envelopes cicd actually produces.

  The drift is documented three times, in CAPS-033, CAPS-036 and CAPS-037, and
  each of those was right to leave it. Nothing validates against the file, so a
  patch would have bought nothing; CAPS-037 said the real choice plainly — that
  wiring it in or deleting it is a decision, not a line edit. What made the
  drift inevitable is that schema.json is the only copy in this repository with
  no mechanism behind it. The Go copies are generated by make sync-schema, the
  toolchain copies by make sync-toolchain, module source is held to contract.json
  by verify-contracts, and workflow pins by check-workflow-pins. schema.json was
  hand-maintained and unchecked, and it drifted on three consecutive changes to
  the envelope.

  So the decision is taken here rather than deferred again. The file stays, its
  six properties and three definitions are added, and its structure is now held
  to schema.go by tests in the package — which is the mechanism it never had.
impact:
  visibility: external
  benefit: >
    The published envelope schema describes the envelope that ships. A consumer
    can validate against it and get a true answer, which was not previously the
    case for any envelope carrying findings, sources or test counts — that is,
    for every combined envelope the aggregator writes.

    Structure can no longer drift silently. Adding a field to Envelope without
    adding it to schema.json fails "Lint Go source", which already runs
    `cd src/internal && go test ./...` and is a required check. The same test
    catches the reverse — a property the struct does not serialise — and a new
    struct-typed field whose definition is missing entirely.
  compatibility: compatible
  risk:
    - >
      Only structure is enforced. The enums, ranges and date-time format in the
      file are hand-authored and unasserted, so severity could gain a Go
      constant that the schema enum never learns, and coveragePercent's 0-100
      bounds are nobody's contract. Those constraints are also the reason the
      file is not generated from the struct tags, which cannot express them — so
      the untested half is the half worth keeping, and that trade is the whole
      shape of this change rather than an oversight in it.
    - >
      Nothing validates a runtime envelope against schema.json even now. The
      tests compare a document to a struct; they do not run a JSON Schema
      validator over anything a module emitted. An envelope could satisfy the
      struct and violate the schema's own constraints — an out-of-range
      coveragePercent, an unrecognised coverageRatchet string — and no check in
      this repository would notice.
    - >
      Module contracts declare outputSchema evidence-1.0.0, which names this
      envelope by version and does not $ref the file. The schema's own
      description previously claimed contracts reference it, which was false;
      the corrected description says what actually holds it honest. But the
      version label and the file's content are still two unlinked things, so
      publishing a breaking envelope change without moving SchemaVersion stays
      possible and unchecked.
    - >
      definitionFor is a hand-written table mapping $defs names to structs, and
      it is exactly the kind of copy that caused this defect.
      TestEveryStructReachableFromEnvelopeHasADefinition walks Envelope by
      reflection and fails in both directions to stop that, but it can only see
      types reachable through exported struct fields with json tags. A payload
      carried as json.RawMessage is opaque to it by design, so a schema written
      for such a payload would be unchecked.
    - >
      Every assertion here was confirmed by mutation before being trusted —
      eight of them, across seven mutations, including running the tests against
      the pre-fix schema.json from git and watching them name the missing fields
      and the missing definition. That is the evidence for the claims in this
      capsule; without it they would be the same untested prose. The required-set
      assertion derives requiredness from the absence of omitempty, which is
      exact for this struct set but would misreport a field that is
      conditionally omitted by a custom MarshalJSON. No type in this package has
      one today.
decisions:
  - id: d01
    choice: keep schema.json and check it, rather than delete it
    options:
      - delete the file, since nothing reads it (rejected)
      - generate it from the struct tags like the Go copies (rejected)
      - keep it hand-authored and hold its structure to schema.go with tests (chosen)
    because: >
      Deleting solves the drift by removing the artifact rather than the class,
      and it removes the only machine-readable description of the envelope this
      repository publishes. The non-container-artifacts brief that extended the
      evidence schema names the file as a deliverable to keep in step, so a consumer is expected
      to find it there.

      Generating it is the repository's own idiom for a copy that must not drift,
      and it is wrong here for a specific reason. Go struct tags cannot express
      the severity enum, the coverageRatchet enum, the 0-100 coverage bounds or
      the date-time format, so a generator would silently drop precisely the
      information that makes the document worth publishing. It would end the
      drift by ending the value.

      Checking keeps both. The constraints stay hand-written where they can be
      stated, and the key set — the only thing that has ever drifted — becomes
      impossible to drift.
    confidence: high
  - id: d02
    choice: assert structure only, and say so in the file
    options:
      - validate real envelopes against the schema with a JSON Schema library (rejected)
      - assert only the property key sets (rejected)
      - assert properties, required and broad JSON types, and document the limit (chosen)
    because: >
      A validator over real envelopes is the strongest check available and it
      needs a JSON Schema dependency in src/internal, which today has none, plus
      fixture envelopes for every module. That is a larger change than the defect
      warrants and it belongs to whoever wants runtime validation, not to the
      person fixing the field list.

      Key sets alone are too weak in a way that matters — with additionalProperties
      false the key set is what rejects an envelope, but a property retyped from
      integer to string passes a key-set test while describing something the
      struct cannot produce. Confirmed by mutation, both for a wrong scalar type
      and for a $ref pointing at the wrong definition.

      The limit is written into the schema's own description rather than left to
      this capsule, because the next person to add an enum value will be reading
      the file and not the capsule. A checked document that looks fully checked
      is the failure mode CAPS-037 named.
    confidence: high
  - id: d03
    choice: make the mapping table defend itself by reflection
    options:
      - trust the table and review it in code review (rejected)
      - walk Envelope and fail on any struct the table does not name (chosen)
    because: >
      Every check here reads schema.json through definitionFor, so a struct the
      table omits is a struct nothing looks at. Adding one struct-typed field to
      Envelope and forgetting the table would leave all the other assertions
      passing, which reproduces this defect one level up — a hand-maintained
      copy with nothing behind it. Review was already the control that let the
      envelope gain six fields without the schema moving, three times running.
      Verified by mutation in both directions, adding a struct field the table
      did not name and removing a table entry that was still reachable.
    confidence: high
tags:
  - evidence
  - schema
  - repo-checks
  - drift
  - testing
