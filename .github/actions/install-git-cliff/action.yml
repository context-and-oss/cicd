name: Install git-cliff
description: >
  Install a pinned, checksum-verified git-cliff onto the runner's PATH.

# Why this exists instead of `uses: taiki-e/install-action`:
#
# A selected Actions policy can restrict marketplace actions and reject a run
# at startup, before any job or check run exists. A source-era outage exposed
# that failure mode. This local action avoids an extra marketplace dependency
# and keeps the pinned installation shared instead of copying it into jobs.
# Destination Actions settings must be verified separately; this file does
# not configure or prove them.
#
# The download is pinned by version and verified against the sha512 published
# with the release, so a swapped artifact fails the step instead of running.
#
# Maintenance risk, named because nothing detects it automatically: nothing in
# CI notices a newer git-cliff. Bump VERSION and SHA512 together — the checksum
# is release asset git-cliff-<VERSION>-x86_64-unknown-linux-gnu.tar.gz.sha512.

runs:
  using: composite
  steps:
    - name: Install git-cliff (pinned, checksum-verified)
      shell: bash
      env:
        VERSION: "2.13.1"
        SHA512: "e716cce3a07dda41b1e370d6afbd7a59eb3d4739509fb7856aeec8da2be28c0396584e29e106141c1a1c535c1827dbc1f60417524f5cfb1da9e11f700bd00f30"
      run: |
        set -euo pipefail
        asset="git-cliff-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
        url="https://github.com/orhun/git-cliff/releases/download/v${VERSION}/${asset}"
        tmp="$(mktemp -d)"
        curl -fsSL --retry 3 -o "${tmp}/${asset}" "$url"
        echo "${SHA512}  ${tmp}/${asset}" | sha512sum -c -
        tar -xzf "${tmp}/${asset}" -C "$tmp"
        install -m 0755 "${tmp}/git-cliff-${VERSION}/git-cliff" /usr/local/bin/git-cliff
        rm -rf "$tmp"
        # Prove the binary that landed is the one that will run, and fail the
        # step if it is not — an install that silently produced nothing would
        # otherwise surface later as a confusing "git cliff failed".
        installed="$(git-cliff --version)"
        echo "$installed"
        case "$installed" in
          *"$VERSION"*) ;;
          *) echo "installed git-cliff is not ${VERSION}: ${installed}" >&2; exit 1 ;;
        esac
